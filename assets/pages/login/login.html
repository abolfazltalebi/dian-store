<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dian store</title>
    <link
      rel="shortcut icon"
      href="../../../assets/font/icon.webp"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="../../../assets/font/font.css" />
    <link
      rel="stylesheet"
      href="../../../assets/bootstrap/css/bootstrap.rtl.css"
    />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <section class=" row row-cols-1 row-cols-md-2 gap-4 gap-md-0">
      <div class="col">
        <div class="bg-login"></div>
      </div>
      <div class="col d-flex align-items-center justify-content-center">
        <div class="w-75">
          <h2>به دیان استور خوش‌آمدید.</h2>
          <p class="text-muted size-6">برای ورود یا ثبت‌نام، لطفاً شماره تماس خود را وارد کنید.</p>
          <form action="">
            <div class="mb-3">
              <label for="phone1" class="form-label">شماره تماس</label>
              <input
                type="text"
                class="form-control"
                id="phone1"
                placeholder="09123456789"
              />
            </div>
            <input
              type="submit"
              class="bg-danger text-white border-0 rounded-3 w-100 py-2"
              value="دریافت کد تایید"
            />
            <p class="text-muted size-6 mt-3">اطلاعات شما محرمانه است و فقط برای احراز هویت استفاده می‌شود.</p>
          </form>
        </div>
      </div>
    </section>
  </body>
</html>
