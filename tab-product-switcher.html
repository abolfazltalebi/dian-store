<!-- product tab -->
<section class="container my-4" dir="rtl">
  <!-- Tabs Navigation -->
  <ul
    class="nav nav-tabs border-0 gap-2 flex-nowrap overflow-x-auto product-tabs"
    id="stepTab"
    role="tablist"
  >
    <li class="nav-item" role="presentation">
      <button
        class="nav-link active"
        id="apple-tab"
        data-bs-toggle="tab"
        data-bs-target="#apple"
        type="button"
        role="tab"
        aria-controls="apple"
        aria-selected="true"
      >
        محصولات اپل
      </button>
    </li>

    <li class="nav-item" role="presentation">
      <button
        class="nav-link"
        id="samsung-tab"
        data-bs-toggle="tab"
        data-bs-target="#samsung"
        type="button"
        role="tab"
        aria-controls="samsung"
        aria-selected="false"
      >
        محصولات سامسونگ
      </button>
    </li>

    <li class="nav-item" role="presentation">
      <button
        class="nav-link"
        id="xiaomi-tab"
        data-bs-toggle="tab"
        data-bs-target="#xiaomi"
        type="button"
        role="tab"
        aria-controls="xiaomi"
        aria-selected="false"
      >
        محصولات شیائومی
      </button>
    </li>
  </ul>

  <!-- Tabs Content -->
  <div class="tab-content pt-3" id="stepTabContent">
    <!-- Apple -->
    <div
      class="tab-pane fade show active"
      id="apple"
      role="tabpanel"
      aria-labelledby="apple-tab"
      tabindex="0"
    >
      <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3">
        <!-- Product Card -->
        <div class="col">
          <div class="card h-100 border rounded-3 shadow-none p-2">
            <div class="ratio ratio-1x1 mb-2">
              <img
                src="https://www.technolife.com/image/small_product-TLP-442895_e391fb7b-89de-4b4b-8a59-6455eb0de500.png"
                class="img-fluid object-fit-contain p-2"
                alt="گوشی اپل"
              />
            </div>

            <div class="card-body p-2 d-flex flex-column">
              <h6 class="card-title small fw-semibold lh-lg product-name">
                گوشی موبایل اپل iPhone 17 Pro Max ظرفیت 256 گیگابایت رم 12
                گیگابایت
              </h6>

              <div class="mt-auto pt-3">
                <div
                  class="d-flex align-items-center justify-content-between gap-1 flex-wrap"
                >
                  <span class="fw-bold text-dark small">
                    ۱,۶۵۰,۰۰۰
                    <small class="text-muted fw-normal">تومان</small>
                  </span>

                  <button class="btn btn-danger btn-sm rounded-2 px-2">
                    خرید
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Product Card -->
        <div class="col">
          <div class="card h-100 border rounded-3 shadow-none p-2">
            <div class="ratio ratio-1x1 mb-2">
              <img
                src="https://www.technolife.com/image/small_product-TLP-435289_927723e4-0318-42e1-ad07-76b2419b7d09.png"
                class="img-fluid object-fit-contain p-2"
                alt="گوشی اپل"
              />
            </div>

            <div class="card-body p-2 d-flex flex-column">
              <h6 class="card-title small fw-semibold lh-lg product-name">
                گوشی موبایل اپل iPhone 17 Pro Max ظرفیت 256 گیگابایت رم 12
                گیگابایت
              </h6>

              <div class="mt-auto pt-3">
                <div
                  class="d-flex align-items-center justify-content-between gap-1 flex-wrap"
                >
                  <span class="fw-bold text-dark small">
                    ۱,۶۵۰,۰۰۰
                    <small class="text-muted fw-normal">تومان</small>
                  </span>
                  <button class="btn btn-danger btn-sm rounded-2 px-2">
                    خرید
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Samsung -->
    <div
      class="tab-pane fade"
      id="samsung"
      role="tabpanel"
      aria-labelledby="samsung-tab"
      tabindex="0"
    >
      <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3">
        <!-- کارت محصولات سامسونگ را اینجا قرار بده -->
      </div>
    </div>

    <!-- Xiaomi -->
    <div
      class="tab-pane fade"
      id="xiaomi"
      role="tabpanel"
      aria-labelledby="xiaomi-tab"
      tabindex="0"
    >
      <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3">
        <!-- کارت محصولات شیائومی را اینجا قرار بده -->
      </div>
    </div>
  </div>
</section>
